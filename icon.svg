<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#0b0c0e"/></radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f47"/><stop offset=".5" stop-color="#23272d"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a0"/><stop offset=".45" stop-color="#c9a24a"/><stop offset="1" stop-color="#7a5c1e"/></linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8d1c0"/><stop offset="1" stop-color="#f4efe2"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f0d78c" stop-opacity=".35"/><stop offset="1" stop-color="#f0d78c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- sombra -->
  <ellipse cx="530" cy="870" rx="300" ry="38" fill="#000" opacity=".5"/>
  <!-- hojas que asoman -->
  <rect x="300" y="196" width="470" height="652" rx="34" fill="url(#pages)"/>
  <path d="M760 230 L760 820" stroke="#b9b09b" stroke-width="6"/><path d="M748 226 L748 826" stroke="#c9c1ad" stroke-width="5"/>
  <!-- tapa -->
  <rect x="262" y="176" width="486" height="672" rx="40" fill="url(#cover)"/>
  <rect x="290" y="204" width="430" height="616" rx="26" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <!-- cinta marcapáginas -->
  <path d="M646 176 L646 300 L672 276 L698 300 L698 176 Z" fill="#8f2d27"/>
  <!-- anillas -->
  <g>
    <rect x="232" y="246" width="78" height="30" rx="15" fill="url(#gold)"/>
    <rect x="232" y="386" width="78" height="30" rx="15" fill="url(#gold)"/>
    <rect x="232" y="608" width="78" height="30" rx="15" fill="url(#gold)"/>
    <rect x="232" y="748" width="78" height="30" rx="15" fill="url(#gold)"/>
  </g>
  <!-- cruz con halo -->
  <circle cx="505" cy="512" r="210" fill="url(#halo)"/>
  <path d="M470 330 H540 V448 H630 V518 H540 V700 H470 V518 H380 V448 H470 Z" fill="url(#gold)" stroke="#5e4614" stroke-width="6" stroke-linejoin="round"/>
  <path d="M478 338 H492 V700 H478 Z" fill="#fff6d0" opacity=".35"/>
</svg>
