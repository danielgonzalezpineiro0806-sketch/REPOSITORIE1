<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"></head><body>
<title>Mi Agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
  /* Diseño: un solo tema oscuro, sobrio. Hierro y oro. Columna única, bloques rectos, dos vistas (Hoy / Progreso). */
  :root {
    --bg: #0e0f11;
    --surface: #17191c;
    --surface-2: #1f2226;
    --line: #2b2f34;
    --text: #ecebe6;
    --muted: #8d9096;
    --gold: #c9a24a;
    --gold-soft: #c9a24a22;
    --heat-1: #2b2f34;
    --heat-2: #5a4c2a;
    --heat-3: #8f753a;
    --danger: #b5533c;
    --danger-text: #e08a72;
    --ink: #111111;
    --f-display: "Oswald", "Arial Narrow", Impact, sans-serif;
    --f-body: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --f-verse: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --r: 8px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font-family: var(--f-body); background: var(--bg); color: var(--text); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, [role=button]:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .app { max-width: 560px; margin: 0 auto; padding-block: 18px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Cabecera */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .eyebrow { font-family: var(--f-display); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .title { font-family: var(--f-display); font-size: 34px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; margin-top: 4px; }
  .h-rank { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .h-rank b { color: var(--gold); font-weight: 600; }
  .avatar { position: relative; flex: none; width: 66px; padding: 3px 5px 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; transition: border-color .4s; }
  .avatar:active { transform: scale(.96); }
  .avatar span { display: block; }
  .avatar .soldier { height: 86px; }
  .avatar .av-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); }
  .avatar .av-bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s; }
  .avatar.pump { animation: av-pump .55s ease-out; border-color: var(--gold); }
  @keyframes av-pump { 35% { transform: scale(1.1); } }

  /* El soldado: animación en reposo */
  .soldier { display: block; width: 100%; height: auto; }
  .soldier .s-fig, .soldier .s-cape, .soldier .s-crest, .soldier .s-eyes, .soldier .s-rays, .soldier .s-flag, .soldier .s-crown { transform-box: fill-box; }
  .soldier .s-fig { transform-origin: 50% 100%; animation: s-breathe 3.4s ease-in-out infinite alternate; }
  .soldier .s-cape { transform-origin: 50% 0; animation: s-sway 4.6s ease-in-out infinite alternate; }
  .soldier .s-flag { transform-origin: 50% 0; animation: s-sway 3.1s ease-in-out infinite alternate; }
  .soldier .s-crest { transform-origin: 50% 100%; animation: s-tilt 3.8s ease-in-out infinite alternate; }
  .soldier .s-eyes { transform-origin: 50% 50%; animation: s-blink 5.2s infinite; }
  .soldier .s-aura { animation: s-pulse 3s ease-in-out infinite alternate; }
  .soldier .s-glow { animation: s-glow 1.7s ease-in-out infinite alternate; }
  .soldier .s-rays { transform-origin: 50% 50%; animation: s-spin 70s linear infinite; }
  .soldier .s-crown { animation: s-bob 2.4s ease-in-out infinite alternate; }
  .soldier.still * { animation: none !important; }
  @keyframes s-breathe { to { transform: scaleY(1.013); } }
  @keyframes s-sway { from { transform: skewX(-1.8deg); } to { transform: skewX(1.8deg); } }
  @keyframes s-tilt { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  @keyframes s-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes s-pulse { from { opacity: .55; } to { opacity: 1; } }
  @keyframes s-glow { from { opacity: .14; } to { opacity: .42; } }
  @keyframes s-spin { to { transform: rotate(360deg); } }
  @keyframes s-bob { to { transform: translateY(-2.5px); } }

  /* Versículo */
  .verse { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 4px; margin-bottom: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .cross { color: var(--gold); width: 22px; height: 22px; flex: none; margin-top: 2px; }
  .verse q, .timer q, .victory q { font-family: var(--f-verse); font-style: italic; line-height: 1.35; quotes: "«" "»"; display: block; text-wrap: pretty; }
  .verse q { font-size: 20px; }
  cite { display: block; margin-top: 6px; font-style: normal; font-size: 12px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }

  /* Semana */
  .week { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  .week .arrow { width: 30px; height: 58px; font-size: 22px; color: var(--muted); flex: none; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; flex: 1; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 0 7px; text-align: center; transition: transform .12s; }
  .day:active { transform: scale(.94); }
  .day .dn { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: .1em; }
  .day .dd { font-family: var(--f-display); font-size: 19px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .day .dot { width: 14px; height: 3px; margin: 5px auto 0; background: transparent; }
  .day .dot.some { background: var(--muted); }
  .day .dot.all { background: var(--gold); }
  .day.today .dd { color: var(--gold); }
  .day.sel { background: var(--gold); border-color: var(--gold); }
  .day.sel .dn, .day.sel .dd { color: var(--ink); }
  .day.sel .dot.some, .day.sel .dot.all { background: var(--ink); }

  /* Propósito de la semana */
  .purpose-add { width: 100%; border: 1px dashed var(--line); border-radius: var(--r); padding: 13px; color: var(--muted); font-weight: 600; font-size: 14px; margin-bottom: 14px; }
  .purpose-add:active { border-color: var(--gold); color: var(--gold); }
  .purpose { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
  .p-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .p-head .eyebrow { font-size: 11px; }
  .p-res { font-family: var(--f-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .p-res.yes { color: var(--gold); border-color: var(--gold); }
  .p-res.no { color: var(--danger-text); border-color: var(--danger); }
  .p-text { display: block; width: 100%; text-align: left; font-size: 17px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
  .p-q { color: var(--muted); font-size: 13px; margin: 12px 0 8px; }

  /* Progreso del día */
  .progress, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .progress { margin-bottom: 22px; }
  .card { margin-bottom: 12px; }
  .progress .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .msg { font-family: var(--f-display); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .progress .pct { font-family: var(--f-display); font-size: 30px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--line); margin-top: 12px; border-radius: 2px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s; }
  .sub { color: var(--muted); margin-top: 8px; font-size: 13px; }

  /* Secciones y tarjetas de objetivo */
  .section { margin-bottom: 20px; }
  .section h3, .sec-title { font-family: var(--f-display); font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .section h3::after, .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sec-title { margin-top: 22px; }
  .goal { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 8px; transition: transform .12s, border-color .2s; }
  .goal:active { transform: scale(.98); }
  .goal .em, .trow .em { width: 46px; height: 46px; border-radius: 6px; display: grid; place-items: center; font-size: 23px; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
  .goal .info { flex: 1; min-width: 0; margin-left: 2px; }
  .goal .gt { font-weight: 600; font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .goal .gm { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .goal .gm b { color: var(--gold); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
  .goal .bar { height: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .goal .bar i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
  .goal .check, .goal .play { width: 34px; height: 34px; border-radius: 4px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .goal .check { font-size: 18px; font-weight: 700; color: transparent; transition: all .2s; }
  .goal .play { color: var(--gold); border-color: var(--gold-soft); border-width: 1px; }
  .goal .play:active { background: var(--gold-soft); }
  .goal.done { border-color: var(--gold-soft); }
  .goal.done .check { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .goal.done .gt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--gold); }
  .goal.done .em { opacity: .5; }
  .goal .more { width: 26px; height: 40px; font-size: 20px; color: var(--muted); flex: none; border-radius: 6px; }
  .goal .more:active { background: var(--line); }

  .empty { text-align: center; padding: 36px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
  .empty .big { font-family: var(--f-display); font-size: 22px; color: var(--text); text-transform: uppercase; letter-spacing: .05em; }
  .empty p { font-size: 15px; margin: 8px 0 0; line-height: 1.5; }

  /* Barra inferior */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .nav-in { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; color: var(--muted); font-family: var(--f-display); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; border-radius: var(--r); }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--gold); }
  .fab { background: var(--gold); color: var(--ink); border-radius: var(--r); padding: 13px 22px; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform .12s; }
  .fab:active { transform: scale(.95); }
  .fab span { font-size: 22px; line-height: 1; }

  /* Hoja inferior */
  .overlay { position: fixed; inset: 0; background: #000b; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 30; background: var(--bg); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 88vh; overflow-y: auto; transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 14px; }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .sheet-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; }
  .icon-btn { width: 42px; height: 42px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: 18px; flex: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .grid.two { grid-template-columns: 1fr 1fr; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 6px 14px; text-align: center; transition: transform .12s, border-color .15s; min-width: 0; }
  .tile:active { transform: scale(.94); border-color: var(--gold); }
  .tile .te { font-size: 30px; display: grid; place-items: center; height: 38px; }
  .tile .te svg { width: 30px; height: 30px; color: var(--gold); }
  .tile .tl { font-size: 13px; font-weight: 600; margin-top: 8px; display: block; line-height: 1.25; }
  .tile.cat .tl, .tile.tpl .tl { font-family: var(--f-display); font-size: 15px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  .tile .ts { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
  .tile .ts.have { color: var(--gold); }
  .tile.tpl { text-align: left; padding: 14px; border-color: var(--gold-soft); display: flex; flex-direction: column; justify-content: flex-start; }
  .tile.tpl .tl { margin-top: 0; color: var(--gold); }

  .label { font-family: var(--f-display); font-size: 13px; font-weight: 500; color: var(--muted); margin: 20px 2px 8px; text-transform: uppercase; letter-spacing: .2em; }
  .label.first { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 2px 12px; }
  .sync { text-align: center; font-size: 12px; margin: 20px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-weight: 600; font-size: 14px; transition: transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip.on { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
  .daychip { width: 44px; height: 44px; padding: 0; }

  .preview { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--gold); border-radius: var(--r); padding: 12px; }
  .preview .em { width: 52px; height: 52px; border-radius: 6px; display: grid; place-items: center; font-size: 26px; background: var(--surface-2); flex: none; }
  .preview .gt { font-size: 18px; font-weight: 700; min-width: 0; }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button, .logbtns button { height: 52px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: 22px; font-weight: 700; }
  .stepper button { width: 52px; }
  .stepper button:active, .logbtns button:active { border-color: var(--gold); }
  .stepper .val { font-family: var(--f-display); font-size: 28px; font-weight: 600; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }

  .logval { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin: 6px 0 16px; }
  .log-input { width: 140px; text-align: center; font-family: var(--f-display); font-size: 56px; font-weight: 700; color: var(--gold); background: none; border: 0; border-bottom: 2px solid var(--line); padding: 0 4px; user-select: text; -webkit-user-select: text; }
  .logval span { font-family: var(--f-display); font-size: 22px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .logbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .logbtns button { font-size: 17px; font-variant-numeric: tabular-nums; }

  .primary { width: 100%; margin-top: 22px; background: var(--gold); color: var(--ink); border-radius: var(--r); padding: 17px; font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .primary:active { transform: scale(.98); }
  .secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); margin-top: 10px; }

  .menu { display: flex; flex-direction: column; gap: 8px; }
  .menu button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; font-weight: 600; font-size: 15px; }
  .menu button:active { border-color: var(--gold); }
  .menu .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .menu .row2 button { text-align: center; }
  .menu .gold { color: var(--gold); border-color: var(--gold-soft); }
  .menu .warn { color: var(--danger-text); }

  .trow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; margin-bottom: 8px; }
  .trow .em { width: 40px; height: 40px; font-size: 20px; }
  .trow .tt { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
  .trow .tt small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; margin-top: 2px; }
  .trow .box { width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 4px; display: grid; place-items: center; color: transparent; font-weight: 700; flex: none; }
  .trow.on { border-color: var(--gold-soft); }
  .trow.on .box { background: var(--gold); border-color: var(--gold); color: var(--ink); }

  .text-input { width: 100%; font: inherit; font-size: 17px; padding: 15px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--text); outline: none; user-select: text; -webkit-user-select: text; }
  .text-input:focus { border-color: var(--gold); }

  /* Vista Progreso */
  .sold { text-align: center; overflow: hidden; }
  .sold > .eyebrow { text-align: left; }
  .sold-fig { width: min(62%, 220px); margin: 0 auto; }
  .sold-fig .soldier, .evo-new .soldier { overflow: visible; }
  .sold .rank-name { position: relative; margin-top: 0; }
  .galones { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 10px; }
  .galones svg { width: 18px; height: 12px; color: var(--gold); }
  .galones .off { opacity: .22; }
  .rank-track { position: relative; height: 8px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .rank-track i { display: block; height: 100%; background: var(--gold); transition: width .6s; }
  .rank-track::before, .rank-track::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
  .rank-track::before { left: 33.33%; }
  .rank-track::after { left: 66.66%; }
  .sold .sub { position: relative; }
  .sold .sub b { color: var(--text); font-weight: 600; }
  .sold-gear { position: relative; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .sold-gear q, .stage-q { font-family: var(--f-verse); font-style: italic; font-size: 19px; line-height: 1.35; quotes: "«" "»"; display: block; margin-top: 6px; text-wrap: pretty; }
  .month { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); text-align: left; }
  .month span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .month b { display: block; margin-top: 3px; font-family: var(--f-display); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stages { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
  .stage { flex: none; width: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 4px 8px; text-align: center; }
  .stage:active { border-color: var(--gold); }
  .stage.cur { border-color: var(--gold); background: var(--surface-2); }
  .stage .st-n { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
  .stage .st-p { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .stage.lock .st-n { color: var(--muted); }
  .stage.lock .soldier, .silhouette .soldier { filter: brightness(0) invert(.24); }

/* ---------- El soldado: 12 formas, pieza a pieza (Efesios 6) ----------

const SM = {                      // material: [base, luz, sombra]
  skin: ['#c4946c', '#e6bd97', '#7d5437'], linen: ['#8d8473', '#b0a794', '#544d40'],

  hair: ['#2b211b', '#52402f', '#0f0b08'], blade: ['#c5ccd3', '#ffffff', '#6f7984'],
  light: ['#f4e8c2', '#fffdf0', '#b8964a'],

let soldierSeq = 0;

function soldierSVG(level, opt) {
  opt = opt || {};
  const L = Math.max(1, Math.min(12, level));
  const b = L <= 2 ? 0 : L <= 6 ? 1 : 2;                       // complexión: crece con el rango
  const sh = [30, 34, 38][b], ww = [17, 18.5, 20][b], hw = [19, 20.5, 22][b];
  const au = [9.5, 11.5, 13.5][b], af = [7.5, 8.5, 9.5][b], tw = [13.5, 15, 16.5][b], cw = [10, 11, 12][b];
  const nw = [5.5, 6.3, 7.2][b], lo = [10, 10.8, 11.6][b];
  const cx = 100, golden = L >= 10;
  const metal = golden ? 'gold' : 'iron', trim = L >= 9 ? 'gold' : metal;
  const tunic = L >= 6 ? 'crimson' : 'linen', cloak = L >= 12 ? 'white' : 'crimson';
  const id = 'sg' + (++soldierSeq);
  const n = v => Math.round(v * 10) / 10;
  const used = {};
  const F = m => { used[m] = 1; return `url(#${id}${m})`; };
  // forma con volumen: relleno degradado y un filo fino del tono oscuro del material

  const Ln = (d, color, w, o) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o ? ` opacity="${o}"` : ''}/>`;
  const Sh = (d, o) => `<path d="${d}" fill="#000" opacity="${o}"/>`;                // sombra
  const Hi = (d, o) => `<path d="${d}" fill="#fff" opacity="${o}"/>`;                // brillo
  const both = html => html + `<g transform="translate(200 0) scale(-1 1)">${html}</g>`;

  let back = '', fig = '';

  /* --- Detrás: luz, rayos, sombra en el suelo --- */

    back += `<radialGradient id="${id}aura"><stop offset="0" stop-color="#edd384" stop-opacity="${o}"/><stop offset=".55" stop-color="#c9a24a" stop-opacity="${n(o / 3)}"/><stop offset="1" stop-color="#c9a24a" stop-opacity="0"/></radialGradient>`;
    let rays = '';
    if (L >= 12) for (let i = 0; i < 12; i++) rays += `<polygon points="100,118 94,-60 106,-60" fill="#edd384" opacity=".13" transform="rotate(${i * 30} 100 118)"/>`;
    fig += '';
    back = `<defs>${back}</defs>` + (rays ? `<g class="s-rays">${rays}</g>` : '') + `<circle class="s-aura" cx="100" cy="118" r="${r}" fill="url(#${id}aura)"/>`;
  }
  back += `<ellipse cx="100" cy="262.5" rx="${34 + b * 4}" ry="4.6" fill="#000" opacity=".5"/>`;

  /* --- Estandarte --- */
  if (L >= 11) {
    const flag = L >= 12 ? 'white' : 'crimson', mark = L >= 12 ? SM.crimson[0] : SM.gold[1];
    fig += Ln('M130,128 L134.5,-33', SM.wood[2], 3.4) + Ln('M130,128 L134.5,-33', SM.wood[1], 1.3, 0.8) +
      `<circle cx="134.6" cy="-34.5" r="2.7" fill="${F('gold')}" stroke="${SM.gold[2]}" stroke-width=".6"/>` +

      Sh('M146,-26 L156,-26 L156,13 L148.5,6 L146,8 Z', 0.16) +
      `<rect x="139.2" y="-20.5" width="3.6" height="21" fill="${mark}"/><rect x="133.6" y="-14.6" width="14.8" height="3.6" fill="${mark}"/></g>`;
  }

  /* --- Manto --- */
  if (L >= 8) {
    const long = L >= 11, bx = sh + (long ? 18 : 12), by = long ? 252 : 236;
    const d = `M${cx - sh + 4},64 C${cx - sh - 13},120 ${cx - bx - 2},190 ${cx - bx},${by} Q${cx - bx / 2},${by + 6} ${cx},${by - 1} Q${cx + bx / 2},${by + 6} ${cx + bx},${by} C${cx + bx + 2},190 ${cx + sh + 13},120 ${cx + sh - 4},64 Z`;

      Sh(`M${cx - 14},150 L${cx + 14},150 L${cx + 20},${by + 1} Q${cx},${by - 2} ${cx - 20},${by + 1} Z`, 0.28) +
      (golden ? Ln(`M${cx - bx + 1},${by - 3} Q${cx - bx / 2},${by + 3} ${cx},${by - 4} Q${cx + bx / 2},${by + 3} ${cx + bx - 1},${by - 3}`, SM.gold[1], 1.8) : '') + `</g>`;

    if (L < 8) leg += Ln(`M${n(lx - 4)},228 L${n(lx + 4)},231 M${n(lx - 4)},231 L${n(lx + 4)},228 M${n(lx - 3.6)},236 L${n(lx + 3.6)},239 M${n(lx - 3.6)},239 L${n(lx + 3.6)},236`, SM.leather[2], 0.9, 0.9);
    else {                                                       // grebas
      leg += S(`M${n(lx - 6.6)},197 Q${lx},189 ${n(lx + 6.2)},197 C${n(lx + c2 + 1)},208 ${n(lx + c2 + 0.2)},229 ${n(lx + 4.8)},246 L${n(lx - 4.8)},246 C${n(lx - c2 - 0.8)},229 ${n(lx - c2 - 2.4)},208 ${n(lx - 6.6)},197 Z`, metal) +

        `<ellipse cx="${lx}" cy="195.5" rx="5.8" ry="4.6" fill="${F(metal)}" stroke="${SM[metal][2]}" stroke-width=".7"/>` +
        (L >= 9 ? Ln(`M${n(lx - 4.8)},243.6 L${n(lx + 4.8)},243.6`, SM.gold[1], 1.8) : '');
    }
  } else {
    leg += S(foot, 'skin') + Ln(`M${n(lx - 10)},258.4 L${n(lx - 9.4)},260.6 M${n(lx - 7.4)},258.8 L${n(lx - 7)},260.8 M${n(lx - 4.8)},259 L${n(lx - 4.6)},260.8`, SM.skin[2], 0.6, 0.8);

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = e => e === 'cross' ? CROSS : esc(e);
const fmt = v => Number(v).toLocaleString('de-DE', { maximumFractionDigits: 2 });   // miles con punto, decimales con coma
const fmtIn = v => String(Math.round(v * 100) / 100).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); x.setHours(0, 0, 0, 0); return x; };
const weekKey = ds => ymd(startOfWeek(parse(ds)));
const dayNum = ds => { const [y, m, d] = ds.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const pick = (list, n) => list[((n % list.length) + list.length) % list.length];
const plural = (n, one, many) => n === 1 ? one : many;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Estado y guardado ---------- */
const KEY = 'mi-agenda-v1';
const blank = () => ({ goals: [], done: {}, log: {}, week: {}, xp: null, seen: null, t: 0 });
let db = blank();
const TODAY = ymd(new Date());
let selected = TODAY;
let weekStart = startOfWeek(new Date());
let view = 'hoy';

function adopt(obj) {
  db = Object.assign(blank(), obj);
  if (db.xp == null) {
    let xp = 0;
    for (const d in db.done) for (const g of db.goals) if ((db.done[d][g.id] || 0) >= (g.target || 1)) xp++;
    db.xp = xp;
  }
  if (db.seen == null) {                                         // primera vez con el soldado: se presenta con su evolución
    const lv = levelInfo(computeStats().pts);
    db.seen = lv.step;
    if (lv.i > 0) pendingEvo = { from: 0, to: lv.i, intro: true };
  }
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
let cloudDoc = null, cloudOk = false, writing = false, pending = false;
// Dice dónde están guardados los datos, para que no haya dudas
function renderSync() {
  $('sync').textContent = cloudOk ? 'Tus datos se guardan en tu cuenta de Claude y en este dispositivo.' : 'Tus datos se guardan solo en este dispositivo.';
}
async function pushCloud() {
  if (!cloudDoc) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await cloudDoc.set({ state: JSON.stringify(db), savedAt: db.t }); cloudOk = true; } catch (e) { cloudOk = false; }
  writing = false;
  renderSync();
  if (pending) { pending = false; pushCloud(); }
}
function save() { db.t = Date.now(); saveLocal(); pushCloud(); }
// Guardado en tu cuenta (para verlo en otros dispositivos); si no está disponible, queda en este navegador
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [store, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!store || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = store.doc('data/users/' + uid + '/agenda');
    const snap = await ref.get();
    cloudDoc = ref; cloudOk = true; renderSync();
    if (snap.exists && snap.data().state) {
      const remote = JSON.parse(snap.data().state);
      if (!db.goals.length || (remote.t || 0) >= (db.t || 0)) { adopt(remote); saveLocal(); render(); if (pendingEvo) showEvo(); }
      else pushCloud();
    } else if (db.goals.length) pushCloud();
  } catch (e) {}
}

/* ---------- Lógica ---------- */
function appliesOn(g, ds, dow) {
  if (g.until && ds >= g.until) return false;
  if (g.repeat === 'once') { if (g.date !== ds) return false; }
  else if (ds < g.from || !g.days.includes(dow)) return false;
  return !(g.skip && g.skip.length && g.skip.includes(ds));
}
const applies = (g, ds) => appliesOn(g, ds, parse(ds).getDay());
const goalsFor = ds => db.goals.filter(g => applies(g, ds));
const countFor = (g, d) => (db.done[d] && db.done[d][g.id]) || 0;
const isDone = (g, d) => countFor(g, d) >= (g.target || 1);
function dayStats(d) {
  const gs = goalsFor(d);
  return { total: gs.length, done: gs.filter(g => isDone(g, d)).length };
}
const perfect = s => s.total > 0 && s.done === s.total;

// Un solo recorrido por todos los días: puntos del soldado, rachas y resumen del mes.
// Cada día vale hasta 100 puntos según lo cumplido, +50 si se cumple todo y +5 por día de racha (hasta +50).
let S = { pts: 0, wins: 0, best: 0, streak: 0, mPts: 0, mWins: 0, mDays: 0, today: 0 };
function computeStats() {
  let first = TODAY;
  for (const g of db.goals) { const d = g.repeat === 'once' ? g.date : g.from; if (d && d < first) first = d; }
  const month = TODAY.slice(0, 7), end = parse(TODAY);
  const r = { pts: 0, wins: 0, best: 0, streak: 0, mPts: 0, mWins: 0, mDays: 0, today: 0 };
  let run = 0, guard = 0;
  for (let d = parse(first); d <= end && guard < 6000; d = addDays(d, 1), guard++) {
    const ds = ymd(d), dow = d.getDay(), marks = db.done[ds] || {};
    let total = 0, done = 0, credit = 0;
    for (const g of db.goals) {
      if (!appliesOn(g, ds, dow)) continue;
      total++;
      const t = g.target || 1, c = marks[g.id] || 0;
      if (c >= t) { done++; credit++; } else credit += c / t;
    }
    if (!total) continue;
    let p = Math.round(100 * credit / total);
    const inMonth = ds.slice(0, 7) === month;
    if (done === total) {
      run++; r.wins++;
      if (run > r.best) r.best = run;
      p += 50 + 5 * Math.min(run, 10);
      if (inMonth) r.mWins++;
    } else if (ds !== TODAY) run = 0;
    r.pts += p;
    if (inMonth) { r.mPts += p; r.mDays++; }
    if (ds === TODAY) r.today = p;
  }
  r.streak = run;
  return r;
}
// Rango, galón (I a III dentro de cada rango) y lo que falta para el siguiente
function levelInfo(pts) {
  let i = 0;
  LEVELS.forEach((l, k) => { if (pts >= l.at) i = k; });
  const cur = LEVELS[i], nx = LEVELS[i + 1];
  if (!nx) return { i, grade: 2, step: i * 3 + 2, name: cur.name, label: cur.name, pct: 100, left: 0, next: '', max: true };
  const span = nx.at - cur.at, into = pts - cur.at, grade = Math.min(2, Math.floor(into * 3 / span));
  return { i, grade, step: i * 3 + grade, name: cur.name, label: cur.name + ' ' + GRADES[grade], pct: into / span * 100, left: nx.at - pts, next: nx.name, max: false };
}
function rate(days) {
  let total = 0, done = 0;
  for (let i = 0; i < days; i++) { const s = dayStats(ymd(addDays(new Date(), -i))); total += s.total; done += s.done; }
  return total ? Math.round(done / total * 100) : null;
}
function setCount(g, d, n) {
  const was = isDone(g, d);
  db.done[d] = db.done[d] || {};
  db.done[d][g.id] = n;
  const now = isDone(g, d);
  if (now && !was) db.xp = (db.xp || 0) + 1;
  else if (!now && was) db.xp = Math.max(0, (db.xp || 0) - 1);
}
// Guarda, repinta y celebra: puntos ganados, galón nuevo, ascenso y día ganado
let pendingEvo = null;
function commit(before, d, origin) {
  const prev = S.pts, lv = levelInfo(computeStats().pts), seen = db.seen || 0;
  let galon = false;
  if (lv.step > seen) {
    if (lv.i > Math.floor(seen / 3)) pendingEvo = { from: Math.floor(seen / 3), to: lv.i };
    else galon = true;
    db.seen = lv.step;
  }
  save();
  render();
  if (S.pts > prev) { pumpAvatar(); if (origin) floatPoints(origin, S.pts - prev); }
  if (perfect(dayStats(d)) && !perfect(before)) victory();
  else if (pendingEvo) showEvo();
  if (galon) toast('Nuevo galón: ' + lv.label);
}

function planChapter(g, ds) {
  if (g.plan === 'prov') return { title: 'Proverbios ' + parse(ds).getDate(), meta: 'Plan de lectura' };
  let n = 0;
  for (const d in db.done) if (d < ds && (db.done[d][g.id] || 0) >= 1) n++;
  const total = GOSPELS.reduce((a, b) => a + b[1], 0);
  let i = n % total;
  for (const [book, ch] of GOSPELS) { if (i < ch) return { title: `${book} ${i + 1}`, meta: `Evangelios · ${(n % total) + 1} de ${total}` }; i -= ch; }
}
const goalTitle = (g, ds) => g.plan ? planChapter(g, ds).title : g.title;

function repeatText(g) {
  if (g.repeat === 'once') return 'Solo este día';
  if (g.days.length === 7) return 'Todos los días';
  if (g.days.join() === '1,2,3,4,5') return 'Lunes a viernes';
  if (g.days.join() === '0,6') return 'Fin de semana';
  if (g.days.join() === '0') return 'Cada domingo';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => g.days.includes(d)).map(d => DAY_SHORT[d]).join(' · ');
}
const repeatId = g => g.repeat === 'once' ? 'once' : g.days.length === 7 ? 'daily' : g.days.join() === '1,2,3,4,5' ? 'weekdays' : g.days.join() === '0,6' ? 'weekend' : 'custom';

function verseFor(ds) {
  const n = dayNum(ds);
  if (ds === TODAY) {
    const y = dayStats(ymd(addDays(new Date(), -1)));
    if (y.total && y.done / y.total < 0.5 && !perfect(dayStats(TODAY))) return pick(V_RISE, n);
    if (n % 2 === 0 && S.streak >= 3) return pick(V_HOLD, n);
  }
  return pick(V_GENERAL, n);
}

/* ---------- Vista Hoy ---------- */
function render() {
  S = computeStats();
  renderHoy();
  if (view === 'prog') renderProg();
}

function renderHoy() {
  const h = new Date().getHours();
  $('hello').textContent = h < 13 ? 'Gana la mañana' : h < 20 ? 'Mantén el rumbo' : 'Cierra el día con honra';
  const sd = parse(selected);
  $('title').textContent = selected === TODAY ? 'Hoy' : sd.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });
  const lv = levelInfo(S.pts);
  $('hRank').innerHTML = `<b>${lv.label}</b> · ${S.streak} ${plural(S.streak, 'día firme', 'días firmes')}`;
  if (avatarLevel !== lv.i) { $('avatarFig').innerHTML = soldierSVG(lv.i + 1, { fit: true, label: 'Tu soldado: ' + lv.name }); avatarLevel = lv.i; }
  $('avatarBar').style.width = lv.pct + '%';
  const [vt, vr] = verseFor(selected);
  $('verseText').textContent = vt;
  $('verseRef').textContent = vr;

  const days = $('days'); days.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), ds = ymd(d), st = dayStats(ds);
    const b = document.createElement('button');
    b.className = 'day' + (ds === TODAY ? ' today' : '') + (ds === selected ? ' sel' : '');
    b.innerHTML = `<div class="dn">${DAY_NAMES[d.getDay()]}</div><div class="dd">${d.getDate()}</div>
      <div class="dot ${st.total ? (perfect(st) ? 'all' : 'some') : ''}"></div>`;
    b.onclick = () => { selected = ds; render(); };
    days.appendChild(b);
  }

  renderPurpose();

  const st = dayStats(selected);
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  $('pct').textContent = pct + '%';
  $('bar').style.width = pct + '%';
  $('sub').textContent = `${st.done} de ${st.total} ${plural(st.total, 'objetivo cumplido', 'objetivos cumplidos')}`;
  $('sub2').textContent = (selected === TODAY ? `${fmt(S.today)} ${plural(S.today, 'punto', 'puntos')} hoy · ` : '') + (lv.max ? 'rango máximo' : `faltan ${fmt(lv.left)} para ${lv.next}`);
  $('msg').textContent = !st.total ? 'Define tu misión' :
    pct === 100 ? 'Misión cumplida' : pct >= 50 ? 'No aflojes' : pct > 0 ? 'En marcha' : 'El día no se gana solo';

  const list = $('list'); list.innerHTML = '';
  const gs = goalsFor(selected);
  if (!gs.length) {
    list.innerHTML = `<div class="empty"><div class="big">Sin objetivos</div><p>Un hombre sin plan es un barco sin timón.<br>Pulsa <b>Nuevo</b> y carga una rutina completa con un toque.</p></div>`;
    return;
  }
  for (const t of ['morning', 'afternoon', 'night', 'any']) {
    const group = gs.filter(g => (g.time || 'any') === t);
    if (!group.length) continue;
    const sec = document.createElement('div'); sec.className = 'section';
    sec.innerHTML = `<h3>${TIME_TITLES[t]}</h3>`;
    for (const g of group) sec.appendChild(goalCard(g));
    list.appendChild(sec);
  }
}

function goalCard(g) {
  const c = countFor(g, selected), target = g.target || 1, done = c >= target;
  const logged = g.unit && db.log[selected] ? db.log[selected][g.id] : null;
  const bits = [];
  if (g.must) bits.push('<b>No negociable</b>');
  if (g.unit && logged != null) bits.push(`${fmt(logged)} ${esc(g.unit)}${g.thr && logged < g.thr ? ` (mínimo ${fmt(g.thr)})` : ''}`);
  if (target > 1) bits.push(`${c} / ${target}`);
  bits.push(g.plan ? planChapter(g, selected).meta : repeatText(g));
  const card = document.createElement('div');
  card.className = 'goal' + (done ? ' done' : '');
  card.setAttribute('role', 'button');
  card.tabIndex = 0;
  card.innerHTML = `
    <div class="em">${esc(g.emoji)}</div>
    <div class="info">
      <div class="gt">${esc(goalTitle(g, selected))}</div>
      <div class="gm">${bits.join(' · ')}</div>
      ${target > 1 ? `<div class="bar"><i style="width:${Math.min(100, c / target * 100)}%"></i></div>` : ''}
    </div>
    ${g.min && !done ? `<button class="play" aria-label="Iniciar temporizador">${PLAY}</button>` : ''}
    <div class="check">✓</div>
    <button class="more" aria-label="Opciones">⋯</button>`;
  card.onclick = e => {
    if (e.target.closest('.more')) return openOptions(g);
    if (e.target.closest('.play')) return openTimer(g);
    tapGoal(g, card.querySelector('.check').getBoundingClientRect());
  };
  card.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); tapGoal(g); } };
  return card;
}

function tapGoal(g, origin) {
  if (g.unit) return openLog(g);
  const before = dayStats(selected), target = g.target || 1, c = countFor(g, selected);
  setCount(g, selected, c >= target ? 0 : c + 1);
  vibrate(15);
  commit(before, selected, origin);
}
let avatarLevel = -1;
function pumpAvatar() { const a = $('avatar'); a.classList.remove('pump'); void a.offsetWidth; a.classList.add('pump'); }
function floatPoints(rect, n) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = '+' + fmt(n);
  el.style.left = (rect.left + rect.width / 2) + 'px';
  el.style.top = (rect.top - 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}

/* ---------- Propósito de la semana ---------- */
function purposeBlock(wk, label) {
  const p = db.week[wk];
  const due = wk < weekKey(TODAY) || (wk === weekKey(TODAY) && new Date().getDay() === 0);
  const res = { yes: 'Cumplido', half: 'A medias', no: 'No cumplido' }[p.review];
  return `<div class="purpose">
    <div class="p-head"><span class="eyebrow">${label}</span>${res ? `<button class="p-res ${p.review}" data-unrev="${wk}">${res}</button>` : ''}</div>
    <button class="p-text" data-edit="${wk}">${esc(p.text)}</button>
    ${due && !p.review ? `<div class="p-q">¿Cumpliste tu palabra?</div><div class="chips">
      <button class="chip" data-rev="yes" data-wk="${wk}">Cumplido</button>
      <button class="chip" data-rev="half" data-wk="${wk}">A medias</button>
      <button class="chip" data-rev="no" data-wk="${wk}">No</button></div>` : ''}
  </div>`;
}
function renderPurpose() {
  const el = $('purpose'), wk = weekKey(selected), cur = weekKey(TODAY);
  const prev = ymd(addDays(parse(cur), -7));
  let h = '';
  if (wk === cur && db.week[prev] && !db.week[prev].review) h += purposeBlock(prev, 'Propósito de la semana pasada');
  h += db.week[wk] ? purposeBlock(wk, 'Propósito de la semana')
    : `<button class="purpose-add" data-edit="${wk}">＋ Fijar el propósito de la semana</button>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openPurpose(b.dataset.edit));
  el.querySelectorAll('[data-unrev]').forEach(b => b.onclick = () => { db.week[b.dataset.unrev].review = ''; save(); render(); });
  el.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => {
    db.week[b.dataset.wk].review = b.dataset.rev;
    save(); render();
    toast(b.dataset.rev === 'yes' ? 'Palabra cumplida.' : b.dataset.rev === 'half' ? 'A medias no basta. Remata esta semana.' : 'Levántate. Esta semana es nueva.');
  });
}
function openPurpose(wk) {
  const p = db.week[wk];
  openSheet(`
    <div class="sheet-head"><h2>Propósito de la semana</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <p class="hint">Una sola cosa. La que más cambiaría tu semana. El domingo te preguntaré si cumpliste.</p>
    <div class="menu">${PURPOSES.map((t, i) => `<button data-p="${i}">${t}</button>`).join('')}</div>
    <div class="label">O escríbelo tú</div>
    <input class="text-input" id="purposeText" maxlength="60" placeholder="Ej: Terminar el proyecto" value="${p ? esc(p.text) : ''}">
    <button class="primary" data-ok>Fijar propósito</button>
    ${p ? `<button class="primary secondary" data-rm>Quitar propósito</button>` : ''}`);
  const set = text => { db.week[wk] = { text, review: '' }; save(); closeSheet(); render(); toast('Propósito fijado. Cúmplelo.'); };
  bind('[data-close]', closeSheet);
  bind('[data-p]', el => set(PURPOSES[+el.dataset.p]));
  bind('[data-ok]', () => { const t = $('purposeText').value.trim(); if (!t) { $('purposeText').focus(); return toast('Elige uno o escríbelo'); } set(t); });
  bind('[data-rm]', () => { delete db.week[wk]; save(); closeSheet(); render(); });
}

/* ---------- Vista Progreso ---------- */
let reveal = false;
try { reveal = localStorage.getItem(KEY + '-reveal') === '1'; } catch (e) {}
const CHEVRON = '<svg viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10 L9 3 L16 10"/></svg>';

// Tarjeta del soldado y la tira con las doce formas
function soldierSection() {
  const lv = levelInfo(S.pts), cur = LEVELS[lv.i];
  const month = new Date().toLocaleDateString('es-ES', { month: 'long' });
  return `<div class="card sold">
      <div class="eyebrow">Tu soldado</div>
      <div class="sold-fig">${soldierSVG(lv.i + 1, { label: cur.name })}</div>
      <div class="rank-name">${cur.name}${lv.max ? '' : `<span class="galones" aria-label="Galón ${GRADES[lv.grade]}">${[0, 1, 2].map(k => `<span class="${k <= lv.grade ? '' : 'off'}">${CHEVRON}</span>`).join('')}</span>`}</div>
      <div class="rank-track"><i style="width:${lv.pct}%"></i></div>
      <div class="sub"><b>${fmt(S.pts)} ${plural(S.pts, 'punto', 'puntos')}</b> · ${lv.max ? 'rango máximo alcanzado' : `faltan ${fmt(lv.left)} para ${lv.next}`}</div>
      <div class="sold-gear"><div class="eyebrow">${lv.i ? 'Última pieza · ' : ''}${cur.gear}</div><q>${cur.verse[0]}</q><cite>${cur.verse[1]}</cite></div>
      <div class="month">
        <div><span>Puntos en ${month}</span><b>${fmt(S.mPts)}</b></div>
        <div><span>Días ganados</span><b>${S.mWins} de ${S.mDays}</b></div>
      </div>
    </div>
    <p class="hint" style="margin-top:12px">Cada día suma hasta 100 puntos según lo que cumplas, 50 más si lo cumples todo y hasta 50 extra por racha. Llegar a Vencedor pide un año entero de días ganados.</p>
    <div class="sec-title">Las doce formas</div>
    <div class="stages" id="stages">${LEVELS.map((l, k) => `
      <button class="stage ${k < lv.i ? 'on' : k === lv.i ? 'cur' : 'lock' + (reveal ? ' shown' : '')}" data-stage="${k}">
        ${soldierSVG(k + 1, { crop: true, still: true, label: l.name })}
        <span class="st-n">${l.name}</span><span class="st-p">${k <= lv.i ? 'Conseguido' : fmt(l.at) + ' pts'}</span>
      </button>`).join('')}</div>
    <button class="linkbtn center" id="reveal">${reveal ? 'Ocultar las formas que faltan' : 'Revelar las formas que faltan'}</button>`;
}
function bindSoldier(el) {
  el.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => openStage(+b.dataset.stage));
  $('reveal').onclick = () => { reveal = !reveal; try { localStorage.setItem(KEY + '-reveal', reveal ? '1' : '0'); } catch (e) {} renderProg(); };
  const cur = el.querySelector('.stage.cur');
  if (cur) $('stages').scrollLeft = Math.max(0, cur.offsetLeft - 96);
}
function openStage(k) {
  const lv = levelInfo(S.pts), l = LEVELS[k], got = k <= lv.i, show = got || reveal;
  openSheet(`
    <div class="sheet-head"><h2>${l.name}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <div class="stage-big ${show ? '' : 'silhouette'}">${soldierSVG(k + 1, { label: l.name })}</div>
    ${got ? `<div class="eyebrow center">${l.gear}</div><q class="stage-q center">${l.verse[0]}</q><cite class="center">${l.verse[1]}</cite>`
      : `<p class="hint center" style="margin-top:12px">${show ? l.gear + '. ' : ''}Se consigue con ${fmt(l.at)} puntos. Te faltan ${fmt(l.at - S.pts)}.</p>`}`);
  bind('[data-close]', closeSheet);
}

function renderProg() {
  const el = $('prog');
  let h = soldierSection();
  if (!db.goals.length && !db.xp) {
    el.innerHTML = h + `<div class="empty" style="margin-top:22px"><div class="big">Nada que medir todavía</div><p>Fija tus objetivos, cúmplelos y vuelve aquí.<br>Cada día cumplido quedará marcado en oro.</p></div>`;
    return bindSoldier(el);
  }
  const r7 = rate(7);
  h += `<div class="sec-title">Tus números</div>
    <div class="tiles">
      <div class="stat"><b>${S.streak}</b><span>Días firmes</span></div>
      <div class="stat"><b>${S.best}</b><span>Mejor racha</span></div>
      <div class="stat"><b>${S.wins}</b><span>Días ganados</span></div>
      <div class="stat"><b>${r7 == null ? '—' : r7 + '%'}</b><span>Últimos 7 días</span></div>
    </div>`;

  // Mapa de las últimas 15 semanas
  const WEEKS = 15, start = addDays(startOfWeek(new Date()), -7 * (WEEKS - 1));
  let months = ['<span></span>'], cells = [1, 2, 3, 4, 5, 6, 0].map(d => `<div class="cell">${DAY_SHORT[d]}</div>`).join('');
  let lastMonth = -1;
  for (let w = 0; w < WEEKS; w++) {
    const first = addDays(start, w * 7);
    months.push(first.getMonth() !== lastMonth ? `<span>${first.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '')}</span>` : '<span></span>');
    lastMonth = first.getMonth();
    for (let d = 0; d < 7; d++) {
      const ds = ymd(addDays(first, d));
      if (ds > TODAY) { cells += '<div class="cell future"></div>'; continue; }
      const s = dayStats(ds), p = s.total ? s.done / s.total : -1;
      const lvl = p < 0 ? 0 : p === 0 ? 1 : p < 0.5 ? 2 : p < 1 ? 3 : 4;
      cells += `<button class="cell l${lvl}${ds === TODAY ? ' now' : ''}" data-day="${ds}" aria-label="${ds}: ${s.total ? `${s.done} de ${s.total}` : 'sin objetivos'}"></button>`;
    }
  }
  if (months[2] !== '<span></span>') months[1] = '<span></span>';
  h += `<div class="sec-title">Últimas 15 semanas</div>
    <div class="card">
      <div class="months">${months.join('')}</div>
      <div class="heat">${cells}</div>
      <div class="legend">Nada <i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--gold)"></i> Todo</div>
    </div>`;

  // Hábitos, 30 días
  const habits = [];
  for (const g of db.goals) {
    let sch = 0, dn = 0;
    for (let i = 0; i < 30; i++) { const ds = ymd(addDays(new Date(), -i)); if (applies(g, ds)) { sch++; if (isDone(g, ds)) dn++; } }
    if (sch) habits.push({ g, sch, dn, pct: Math.round(dn / sch * 100) });
  }
  habits.sort((a, b) => b.pct - a.pct || b.sch - a.sch);
  if (habits.length) {
    h += `<div class="sec-title">Tus hábitos · 30 días</div><div class="card">${habits.map(x => `
      <div class="hrow">
        <div class="he">${esc(x.g.emoji)}</div><div class="hn">${esc(x.g.title)}</div><div class="hp">${x.pct}%</div>
        <div class="hb"><i style="width:${x.pct}%"></i></div>
        <div class="hc">${x.dn} de ${x.sch} ${plural(x.sch, 'día', 'días')}</div>
      </div>`).join('')}</div>`;
  }

  // Registros con cifra
  let charts = '';
  for (const g of db.goals) {
    if (!g.unit) continue;
    const series = Object.keys(db.log).filter(d => db.log[d] && db.log[d][g.id] != null).sort().map(d => db.log[d][g.id]);
    if (!series.length) continue;
    const last = series.slice(-14), max = Math.max(...last, 0.0001);
    const sum = series.reduce((a, b) => a + b, 0), best = Math.max(...series);
    const extra = SUM_UNITS.includes(g.unit) ? `Total ${fmt(sum)} ${esc(g.unit)}` : `Mejor ${fmt(best)} · media ${fmt(Math.round(sum / series.length * 10) / 10)}`;
    charts += `<div class="card">
      <div class="chart-head"><b>${esc(g.emoji)} ${esc(g.title)}</b><span>${fmt(series[series.length - 1])} ${esc(g.unit)}</span></div>
      <div class="bars">${last.map(v => `<i style="height:${Math.max(4, v / max * 100)}%" title="${fmt(v)}"></i>`).join('')}</div>
      <div class="sub">${series.length} ${plural(series.length, 'registro', 'registros')} · ${extra}</div>
    </div>`;
  }
  if (charts) h += `<div class="sec-title">Tus marcas</div>${charts}`;

  // Propósitos semanales
  const weeks = Object.keys(db.week).sort().reverse().slice(0, 8);
  if (weeks.length) {
    h += `<div class="sec-title">Propósitos semanales</div><div class="card">${weeks.map(wk => {
      const p = db.week[wk], res = { yes: 'Cumplido', half: 'A medias', no: 'No cumplido' }[p.review] || (wk >= weekKey(TODAY) ? 'En curso' : 'Sin revisar');
      return `<div class="wrow"><div><small>Semana del ${parse(wk).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</small><b>${esc(p.text)}</b></div><span class="p-res ${p.review || ''}">${res}</span></div>`;
    }).join('')}</div>`;
  }

  el.innerHTML = h;
  bindSoldier(el);
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    selected = b.dataset.day; weekStart = startOfWeek(parse(selected)); go('hoy');
  });
}

const activeGoal = key => db.goals.find(g => (g.key === key || (!g.key && g.title === G[key].t)) && !g.until && (g.repeat !== 'once' || g.date === selected));

function draftFromKey(key) {
  const c = G[key], r = c.r || 'daily', rep = REPEATS.find(x => x.id === r);

function goalFromDraft(d) {

    repeat: d.repeat === 'once' ? 'once' : 'days', date: selected, from: selected, days: d.days.slice().sort(), skip: [],
    min: d.min || 0, unit: d.unit || '', step: d.step || 0, big: d.big || 0, def: d.def || 0, thr: d.thr || 0, q: d.q || '', plan: d.plan || '', must: !!d.must,

}
function goalHint(c) {
  if (c.s) return c.s;

      <div class="label">Cuándo</div>

      <div class="chips">${REPEATS.map(r => `<button class="chip ${draft.repeat === r.id ? 'on' : ''}" data-rep="${r.id}">${r.label}</button>`).join('')}</div>
      ${draft.repeat === 'custom' ? `<div class="chips" style="margin-top:10px">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="chip daychip ${draft.days.includes(d) ? 'on' : ''}" data-day="${d}">${DAY_SHORT[d]}</button>`).join('')}</div>` : ''}

      ${draft.unit || draft.plan ? '' : `<div class="label">Veces al día</div>
      <div class="stepper">
        <button data-step="-1" aria-label="Menos">−</button><div class="val">${draft.target}×</div><button data-step="1" aria-label="Más">＋</button>
      </div>`}

      <div class="label">Opciones</div>
      <div class="chips">
        <button class="chip ${draft.must ? 'on' : ''}" data-must>No negociable</button>
        ${draft.unit ? '' : `<button class="chip ${draft.min ? 'on' : ''}" data-timer>Con temporizador</button>`}
      </div>

      <button class="primary" data-save>${edit ? 'Guardar cambios' : 'Me comprometo'}</button>`, keep);
    const ti = $('editTitle');
    if (ti) ti.oninput = () => { draft.title = ti.value; };
    bind('[data-back]', () => opts.back ? opts.back() : closeSheet());
    bind('[data-close]', closeSheet);
    bind('[data-time]', el => { draft.time = el.dataset.time; paint(true); });
    bind('[data-rep]', el => {
      draft.repeat = el.dataset.rep;
      const r = REPEATS.find(x => x.id === draft.repeat);
      if (r.days) draft.days = r.days.slice();
      if (draft.repeat === 'custom' && !draft.days.length) draft.days = [parse(selected).getDay()];
      paint(true);
    });
    bind('[data-day]', el => {
      const d = +el.dataset.day;
      draft.days = draft.days.includes(d) ? draft.days.filter(x => x !== d) : [...draft.days, d];
      paint(true);
    });
    bind('[data-step]', el => { draft.target = Math.max(1, Math.min(20, draft.target + +el.dataset.step)); paint(true); });
    bind('[data-must]', () => { draft.must = !draft.must; paint(true); });
    bind('[data-timer]', () => { draft.min = draft.min ? 0 : 25; paint(true); });
    bind('[data-save]', () => {
      if (draft.repeat !== 'once' && !draft.days.length) return toast('Elige al menos un día');

          repeat: once ? 'once' : 'days', days: draft.days.slice().sort() });
        if (once) edit.date = selected;
        save(); closeSheet(); render(); toast('Cambios guardados');
      } else {
        db.goals.push(goalFromDraft(draft));

// Opciones de un objetivo
function openOptions(g) {
  const recurring = g.repeat !== 'once', c = countFor(g, selected);
  let armed = false;
  const paint = keep => {
    openSheet(`
      <div class="sheet-head"><h2>${esc(g.emoji)} ${esc(g.title)}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <div class="menu">
        ${g.unit ? '' : `<button class="gold" data-timer>Iniciar temporizador de enfoque</button>`}
        <button data-edit>Editar</button>
        <div class="row2"><button data-up>Subir</button><button data-down>Bajar</button></div>
        ${(g.target || 1) > 1 && c > 0 ? `<button data-reset>Poner el contador a 0</button>` : ''}
        ${recurring ? `<button data-skip>Saltar solo este día</button><button data-end>Dejar de hacerlo desde este día</button>` : ''}
        <button class="warn" data-del>${armed ? 'Pulsa otra vez para borrar' : recurring ? 'Borrar con todo su historial' : 'Borrar objetivo'}</button>
      </div>`, keep);
    bind('[data-close]', closeSheet);
    bind('[data-timer]', () => openTimer(g));
    bind('[data-edit]', () => stepDetails(Object.assign({}, g, { repeat: repeatId(g), days: g.days.slice() }), { edit: g, back: () => openOptions(g) }));
    bind('[data-up]', () => move(g, -1));
    bind('[data-down]', () => move(g, 1));
    bind('[data-reset]', () => { const before = dayStats(selected); setCount(g, selected, 0); closeSheet(); commit(before, selected); });
    bind('[data-skip]', () => { g.skip = [...(g.skip || []), selected]; save(); closeSheet(); render(); toast('Saltado este día'); });
    bind('[data-end]', () => {
      if (selected <= g.from) db.goals = db.goals.filter(x => x !== g); else g.until = selected;
      save(); closeSheet(); render(); toast('Objetivo terminado. Su historial se conserva.');
    });
    bind('[data-del]', () => {
      if (!armed) { armed = true; return paint(true); }
      db.goals = db.goals.filter(x => x !== g);
      save(); closeSheet(); render(); toast('Objetivo borrado');
    });
  };
  paint();
}
function move(g, dir) {
  const group = goalsFor(selected).filter(x => (x.time || 'any') === (g.time || 'any'));
  const j = group.indexOf(g) + dir;
  if (j < 0 || j >= group.length) return toast(dir < 0 ? 'Ya es el primero' : 'Ya es el último');
  const a = db.goals.indexOf(g), b = db.goals.indexOf(group[j]);
  [db.goals[a], db.goals[b]] = [db.goals[b], db.goals[a]];
  save(); render();
}

/* ---------- Temporizador de enfoque ---------- */
let timer = null, wake = null, actx = null;
function openTimer(g) {
  closeSheet();
  timer = { g, date: selected, mins: g.min || 25, state: 'setup', end: 0, left: 0, verse: pick(V_FOCUS, Math.floor(Math.random() * V_FOCUS.length)) };

  paintTimer();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function timerLeft() {
  const t = timer;
  return t.state === 'setup' ? t.mins * 60000 : t.state === 'run' ? Math.max(0, t.end - Date.now()) : t.left;
}
function paintTimer() {
  const t = timer, done = t.state === 'done';
  $('timerBox').innerHTML = `
    <div class="eyebrow">${done ? 'Bloque completado' : 'Enfoque total'}</div>
    <div class="t-title">${esc(goalTitle(t.g, t.date))}</div>
    <div class="t-clock ${done ? 'done' : ''}" id="tClock">${done ? 'Hecho' : clock(timerLeft())}</div>
    ${done ? '' : `<div class="track"><i id="tBar" style="width:${100 - timerLeft() / (t.mins * 60000) * 100}%"></i></div>`}
    ${t.state === 'setup' ? `<div class="chips">${[15, 25, 50, 90].map(m => `<button class="chip ${t.mins === m ? 'on' : ''}" data-m="${m}">${m} min</button>`).join('')}</div>` : ''}
    <q>${esc(t.verse[0])}</q><cite>${t.verse[1]}</cite>
    <div class="t-actions">
      ${t.state === 'setup' ? `<button class="primary" data-a="start">Empezar</button>` : ''}
      ${t.state === 'run' ? `<button class="primary secondary" data-a="pause">Pausar</button>` : ''}
      ${t.state === 'pause' ? `<button class="primary" data-a="resume">Reanudar</button>` : ''}
      ${done ? `<button class="primary" data-a="finish">Sumar y cerrar</button>` : ''}
      ${t.state === 'run' || t.state === 'pause' ? `<button class="primary secondary" data-a="finish">Dar por hecho</button>` : ''}
      ${done ? '' : `<button class="linkbtn" data-a="quit">${t.state === 'setup' ? 'Cancelar' : 'Abandonar el bloque'}</button>`}
    </div>`;
  $('timerBox').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { t.mins = +b.dataset.m; paintTimer(); });
  $('timerBox').querySelectorAll('[data-a]').forEach(b => b.onclick = () => timerAction(b.dataset.a));
}
function timerAction(a) {
  const t = timer;
  if (a === 'start' || a === 'resume') {
    t.end = Date.now() + (a === 'start' ? t.mins * 60000 : t.left);
    t.state = 'run';
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) {}
    clearInterval(t.iv); t.iv = setInterval(tick, 250);
    paintTimer();
  } else if (a === 'pause') {
    t.left = timerLeft(); t.state = 'pause'; clearInterval(t.iv); paintTimer();
  } else if (a === 'finish' || a === 'quit') {
    clearInterval(t.iv);
    try { wake && wake.release(); } catch (e) {}
    wake = null;
    $('timer').hidden = true;
    timer = null;
    if (a === 'finish' && !isDone(t.g, t.date)) {
      const before = dayStats(t.date);
      setCount(t.g, t.date, countFor(t.g, t.date) + 1);
      commit(before, t.date);
    }
  }
}
function tick() {
  const t = timer;
  if (!t || t.state !== 'run') return;
  const left = timerLeft();
  if (left <= 0) {
    clearInterval(t.iv); t.state = 'done'; t.left = 0;
    vibrate([200, 100, 200, 100, 400]); beep(); paintTimer();
    return;
  }
  const c = $('tClock'), b = $('tBar');
  if (c) c.textContent = clock(left);
  if (b) b.style.width = (100 - left / (t.mins * 60000) * 100) + '%';
}
function beep() {
  try {
    if (!actx) return;
    [0, 0.4, 0.8].forEach(dt => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + dt;
      o.frequency.value = 660; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.start(t0); o.stop(t0 + 0.32);
    });
  } catch (e) {}
}

/* ---------- Ascenso ---------- */
function showEvo() {
  const e = pendingEvo;
  pendingEvo = null;
  if (!e) return;
  const l = LEVELS[e.to];
  $('evoEyebrow').textContent = e.intro ? 'Tu soldado' : 'Ascenso';
  $('evoOld').innerHTML = soldierSVG(e.from + 1, { still: true, label: LEVELS[e.from].name });
  $('evoNew').innerHTML = soldierSVG(e.to + 1, { label: l.name });
  $('evoName').textContent = l.name;
  $('evoGear').textContent = 'Has recibido: ' + l.gear;
  $('evoVerse').textContent = l.verse[0];
  $('evoRef').textContent = l.verse[1];
  let sparks = '';
  for (let i = 0; i < 28; i++) sparks += `<i class="spark" style="--a:${Math.round(i * 360 / 28 + Math.random() * 9)}deg;--d:${Math.round(95 + Math.random() * 115)}px"></i>`;
  $('evoSparks').innerHTML = sparks;
  const el = $('evo');
  el.hidden = false;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  el.scrollTop = 0;
  vibrate([30, 60, 30, 60, 140]);
  if (!e.intro) chime();
}
function chime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + 0.95 + i * 0.11;
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i === 3 ? 0.9 : 0.35));
      o.start(t0); o.stop(t0 + 1);
    });
  } catch (e) {}
}

/* ---------- Día ganado ---------- */
function victory() {
  const n = S.streak;
  $('victoryStreak').textContent = n > 1 ? `${n} días firmes` : 'Primer día firme';
  $('victory').classList.add('show');
  vibrate([40, 80, 40]);
}

/* ---------- Arranque ---------- */
$('overlay').onclick = closeSheet;
$('victoryClose').onclick = () => { $('victory').classList.remove('show'); if (pendingEvo) showEvo(); };
$('evoClose').onclick = () => { $('evo').hidden = true; $('evo').classList.remove('go'); };
$('avatar').onclick = () => go('prog');
$('fab').onclick = stepCategory;
$('tabHoy').onclick = () => go('hoy');
$('tabProg').onclick = () => go('prog');
$('prevWeek').onclick = () => { weekStart = addDays(weekStart, -7); render(); };
$('nextWeek').onclick = () => { weekStart = addDays(weekStart, 7); render(); };
window.addEventListener('hashchange', () => { const v = location.hash === '#progreso' ? 'prog' : 'hoy'; if (v !== view) setView(v); });

try { const raw = localStorage.getItem(KEY); if (raw) adopt(JSON.parse(raw)); else adopt({}); } catch (e) { adopt({}); }
setView(location.hash === '#progreso' ? 'prog' : 'hoy');
renderSync();
if (pendingEvo) { saveLocal(); setTimeout(showEvo, 500); }
initCloud();
</script>
