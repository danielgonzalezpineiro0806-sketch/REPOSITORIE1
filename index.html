<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<title>Mi Agenda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
  :root {
    --bg: #f4f2ff;
    --card: #ffffff;
    --text: #1f1d2b;
    --muted: #7a7891;
    --line: #e7e4f5;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --ok: #20c997;
    --shadow: 0 6px 20px rgba(80, 60, 180, .10);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131c;
      --card: #201f2c;
      --text: #f2f1fa;
      --muted: #9b99b3;
      --line: #2e2c3e;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; padding-top: max(16px, env(safe-area-inset-top)); }

  /* Cabecera */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .hello { font-size: 15px; color: var(--muted); }
  .title { font-size: 26px; font-weight: 800; margin-top: 2px; text-transform: capitalize; }
  .streak { background: var(--card); border-radius: 999px; padding: 10px 14px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; }

  /* Semana */
  .week { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .week .arrow { width: 34px; height: 60px; border-radius: 14px; font-size: 20px; color: var(--muted); flex: none; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; flex: 1; }
  .day {
    background: var(--card); border-radius: 16px; padding: 8px 0; text-align: center;
    box-shadow: var(--shadow); position: relative; transition: transform .15s;
  }
  .day:active { transform: scale(.94); }
  .day .dn { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .day .dd { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .day .dot { width: 6px; height: 6px; border-radius: 50%; margin: 4px auto 0; background: transparent; }
  .day .dot.some { background: var(--accent-2); }
  .day .dot.all { background: var(--ok); }
  .day.today .dd { color: var(--accent); }
  .day.sel { background: var(--accent); color: #fff; }
  .day.sel .dn, .day.sel .dd { color: #fff; }
  .day.sel .dot.some, .day.sel .dot.all { background: #fff; }

  /* Progreso */
  .progress {
    background: linear-gradient(135deg, var(--accent), #a55eea);
    color: #fff; border-radius: var(--radius); padding: 18px; display: flex; align-items: center; gap: 18px;
    box-shadow: 0 10px 30px rgba(108, 92, 231, .35); margin-bottom: 20px;
  }
  .ring { width: 84px; height: 84px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .progress .msg { font-size: 19px; font-weight: 800; }
  .progress .sub { opacity: .85; margin-top: 4px; font-size: 14px; }

  /* Secciones y tarjetas */
  .section { margin-bottom: 18px; }
  .section h3 { font-size: 15px; color: var(--muted); margin: 0 0 10px 4px; font-weight: 700; }
  .goal {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border-radius: 20px; padding: 14px; margin-bottom: 10px;
    box-shadow: var(--shadow); border-left: 6px solid var(--c); transition: transform .15s, opacity .3s;
    position: relative; overflow: hidden;
  }
  .goal:active { transform: scale(.97); }
  .goal .em { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; flex: none;
    background: color-mix(in srgb, var(--c) 18%, transparent); }
  .goal .info { flex: 1; min-width: 0; }
  .goal .gt { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal .gm { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .goal .bar { height: 6px; background: var(--line); border-radius: 6px; margin-top: 8px; overflow: hidden; }
  .goal .bar i { display: block; height: 100%; background: var(--c); border-radius: 6px; transition: width .3s; }
  .goal .check {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); flex: none;
    display: grid; place-items: center; font-size: 20px; color: transparent; transition: all .2s;
  }
  .goal.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .goal.done .gt { text-decoration: line-through; opacity: .55; }
  .goal.done .em { filter: grayscale(.6); opacity: .7; }
  .goal .more { width: 36px; height: 40px; font-size: 22px; color: var(--muted); flex: none; border-radius: 12px; }
  .goal .more:active { background: var(--line); }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.05); } }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-size: 64px; }
  .empty p { font-size: 17px; margin: 10px 0 0; }

  /* Botón flotante */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom));
    background: var(--accent); color: #fff; border-radius: 999px; padding: 18px 30px; font-size: 19px; font-weight: 800;
    box-shadow: 0 12px 30px rgba(108, 92, 231, .5); display: flex; white-space: nowrap; align-items: center; gap: 10px; z-index: 10;
    transition: transform .15s;
  }
  .fab:active { transform: translateX(-50%) scale(.94); }
  .fab span { font-size: 26px; line-height: 1; }

  /* Hoja inferior */
  .overlay { position: fixed; inset: 0; background: rgba(10, 8, 30, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 30;
    background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px max(20px, env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto; transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1);
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 44px; height: 5px; background: var(--line); border-radius: 5px; margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .sheet-head h2 { flex: 1; margin: 0; font-size: 21px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--card); font-size: 20px; box-shadow: var(--shadow); flex: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .tile {
    background: var(--card); border-radius: 20px; padding: 16px 6px; text-align: center; box-shadow: var(--shadow);
    border: 3px solid transparent; transition: transform .15s;
  }
  .tile:active { transform: scale(.93); }
  .tile .te { font-size: 36px; display: block; }
  .tile .tl { font-size: 14px; font-weight: 700; margin-top: 6px; display: block; }
  .tile.cat { background: color-mix(in srgb, var(--c) 16%, var(--card)); }

  .label { font-size: 14px; font-weight: 800; color: var(--muted); margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--card); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 15px;
    box-shadow: var(--shadow); border: 3px solid transparent; transition: transform .12s;
  }
  .chip:active { transform: scale(.93); }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .daychip { width: 44px; height: 44px; padding: 0; border-radius: 50%; }

  .preview {
    display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 20px; padding: 14px;
    box-shadow: var(--shadow); border-left: 6px solid var(--c);
  }
  .preview .em { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--c) 18%, transparent); }
  .preview .gt { font-size: 19px; font-weight: 800; }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 52px; height: 52px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-size: 26px; font-weight: 800; }
  .stepper button:active { transform: scale(.92); }
  .stepper .val { font-size: 26px; font-weight: 800; min-width: 70px; text-align: center; }

  .primary {
    width: 100%; margin-top: 22px; background: var(--accent); color: #fff; border-radius: 20px; padding: 18px;
    font-size: 19px; font-weight: 800; box-shadow: 0 10px 25px rgba(108, 92, 231, .4);
  }
  .primary:active { transform: scale(.97); }
  .danger { background: #ff6b6b; box-shadow: 0 10px 25px rgba(255, 107, 107, .35); }
  .secondary { background: var(--card); color: var(--text); box-shadow: var(--shadow); margin-top: 10px; }

  .text-input {
    width: 100%; font: inherit; font-size: 18px; padding: 16px; border-radius: 18px; border: 3px solid var(--line);
    background: var(--card); color: var(--text); outline: none; user-select: text; -webkit-user-select: text;
  }
  .text-input:focus { border-color: var(--accent); }

  /* Confeti */
  .confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  .toast {
    position: fixed; left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translate(-50%, -150%);
    background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 700; z-index: 60;
    transition: transform .3s; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="hello" id="hello">¡Hola!</div>
      <div class="title" id="title">Hoy</div>
    </div>
    <div class="streak" id="streak">🔥 0</div>
  </header>

  <div class="week">
    <button class="arrow" id="prevWeek" aria-label="Semana anterior">‹</button>
    <div class="days" id="days"></div>
    <button class="arrow" id="nextWeek" aria-label="Semana siguiente">›</button>
  </div>

  <div class="progress">
    <div class="ring">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle cx="42" cy="42" r="34" stroke="rgba(255,255,255,.25)" stroke-width="10" fill="none"/>
        <circle id="ringFg" cx="42" cy="42" r="34" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"
                stroke-dasharray="213.6" stroke-dashoffset="213.6" style="transition: stroke-dashoffset .5s"/>
      </svg>
      <div class="pct" id="pct">0%</div>
    </div>
    <div>
      <div class="msg" id="msg">¡A por el día!</div>
      <div class="sub" id="sub">0 de 0 objetivos</div>
    </div>
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="fab"><span>＋</span> Añadir objetivo</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Catálogo de objetivos (todo con botones) ---------- */
const CATS = [
  { id: 'sport', name: 'Deporte', emoji: '💪', color: '#ff6b6b', goals: [
    ['🏃', 'Correr'], ['🏋️', 'Gimnasio'], ['🚶', 'Caminar 30 min'], ['🤸', 'Estirar'], ['🚴', 'Bici'], ['🏊', 'Nadar'], ['⚽', 'Fútbol'], ['🧗', 'Escalar'] ] },
  { id: 'study', name: 'Estudio', emoji: '📚', color: '#4dabf7', goals: [
    ['📖', 'Estudiar'], ['📝', 'Repasar apuntes'], ['✏️', 'Hacer deberes'], ['🗣️', 'Practicar idioma'], ['🎓', 'Ver una clase'], ['🧪', 'Preparar examen'] ] },
  { id: 'work', name: 'Trabajo', emoji: '💼', color: '#845ef7', goals: [
    ['⭐', 'Tarea importante'], ['📧', 'Revisar email'], ['👥', 'Reunión'], ['📞', 'Llamada'], ['🗓️', 'Planificar el día'], ['💻', 'Proyecto'] ] },
  { id: 'health', name: 'Salud', emoji: '❤️', color: '#20c997', goals: [
    ['💧', 'Beber agua', 8], ['💊', 'Medicación'], ['🍎', 'Comer fruta', 3], ['😴', 'Dormir 8 horas'], ['🧘', 'Meditar'], ['🥗', 'Comer sano'], ['🦷', 'Cepillarse', 3] ] },
  { id: 'home', name: 'Hogar', emoji: '🏠', color: '#fab005', goals: [
    ['🧹', 'Limpiar'], ['🛒', 'Hacer la compra'], ['🍳', 'Cocinar'], ['🧺', 'Poner lavadora'], ['🪴', 'Regar plantas'], ['🗑️', 'Sacar la basura'], ['🛏️', 'Hacer la cama'], ['🐶', 'Pasear al perro', 2] ] },
  { id: 'social', name: 'Social', emoji: '🎉', color: '#f783ac', goals: [
    ['📱', 'Llamar a la familia'], ['🍻', 'Quedar con amigos'], ['❤️', 'Cita'], ['🎂', 'Cumpleaños'], ['💌', 'Escribir a alguien'] ] },
  { id: 'fun', name: 'Ocio', emoji: '🎨', color: '#ff922b', goals: [
    ['📕', 'Leer'], ['🎸', 'Tocar música'], ['🎨', 'Dibujar'], ['🎮', 'Jugar'], ['🎬', 'Ver una peli'], ['📵', 'Desconectar del móvil'] ] },
  { id: 'money', name: 'Dinero', emoji: '💰', color: '#51cf66', goals: [
    ['🐷', 'Ahorrar'], ['📊', 'Revisar gastos'], ['🧾', 'Pagar facturas'], ['🚫', 'Cero caprichos'] ] },
];

const TIMES = [
  { id: 'morning', label: '☀️ Mañana' },
  { id: 'afternoon', label: '🌤️ Tarde' },
  { id: 'night', label: '🌙 Noche' },
  { id: 'any', label: '⏰ Cuando sea' },
];
const TIME_TITLES = { morning: '☀️ Mañana', afternoon: '🌤️ Tarde', night: '🌙 Noche', any: '⏰ En cualquier momento' };

const REPEATS = [
  { id: 'once', label: '1️⃣ Solo ese día' },
  { id: 'daily', label: '🔁 Todos los días', days: [0, 1, 2, 3, 4, 5, 6] },
  { id: 'weekdays', label: '💼 Lunes a viernes', days: [1, 2, 3, 4, 5] },
  { id: 'weekend', label: '🏖️ Fin de semana', days: [0, 6] },
  { id: 'custom', label: '✋ Elegir días' },
];
const DAY_SHORT = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const DAY_NAMES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const EMOJI_PICK = ['🎯', '⭐', '✅', '🔥', '💡', '🚀', '🎵', '📌', '🌱', '🧠', '✈️', '🎁', '🛠️', '📷', '🧩', '🏆'];

/* ---------- Almacenamiento ---------- */
const KEY = 'mi-agenda-v1';
let db = { goals: [], done: {} };
try { const raw = localStorage.getItem(KEY); if (raw) db = Object.assign(db, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); x.setHours(0, 0, 0, 0); return x; };
const TODAY = ymd(new Date());

let selected = TODAY;
let weekStart = startOfWeek(new Date());

/* ---------- Lógica ---------- */
function goalsFor(dateStr) {
  const dow = parse(dateStr).getDay();
  return db.goals.filter(g => {
    if ((g.skip || []).includes(dateStr)) return false;
    if (g.repeat === 'once') return g.date === dateStr;
    if (dateStr < g.from) return false;
    return g.days.includes(dow);
  });
}
const countFor = (g, d) => (db.done[d] && db.done[d][g.id]) || 0;
const isDone = (g, d) => countFor(g, d) >= (g.target || 1);

function dayStats(d) {
  const gs = goalsFor(d);
  const done = gs.filter(g => isDone(g, d)).length;
  return { total: gs.length, done };
}

function streak() {
  let n = 0, d = new Date();
  // si hoy aún no está completo, empezamos a contar desde ayer
  const t = dayStats(ymd(d));
  if (!(t.total && t.done === t.total)) d = addDays(d, -1);
  for (let i = 0; i < 365; i++) {
    const s = dayStats(ymd(d));
    if (s.total && s.done === s.total) { n++; d = addDays(d, -1); }
    else if (!s.total) { d = addDays(d, -1); if (i > 60 && n === 0) break; }
    else break;
  }
  return n;
}

/* ---------- Render principal ---------- */
const $ = id => document.getElementById(id);

function render() {
  const now = new Date(), h = now.getHours();
  $('hello').textContent = h < 13 ? '☀️ ¡Buenos días!' : h < 20 ? '🌤️ ¡Buenas tardes!' : '🌙 ¡Buenas noches!';
  const sd = parse(selected);
  $('title').textContent = selected === TODAY ? 'Hoy' :
    sd.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });
  $('streak').textContent = `🔥 ${streak()}`;

  // semana
  const days = $('days'); days.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), ds = ymd(d), st = dayStats(ds);
    const b = document.createElement('button');
    b.className = 'day' + (ds === TODAY ? ' today' : '') + (ds === selected ? ' sel' : '');
    b.innerHTML = `<div class="dn">${DAY_NAMES[d.getDay()]}</div><div class="dd">${d.getDate()}</div>
      <div class="dot ${st.total ? (st.done === st.total ? 'all' : 'some') : ''}"></div>`;
    b.onclick = () => { selected = ds; render(); };
    days.appendChild(b);
  }

  // progreso
  const st = dayStats(selected);
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  $('pct').textContent = pct + '%';
  $('ringFg').style.strokeDashoffset = 213.6 * (1 - pct / 100);
  $('sub').textContent = `${st.done} de ${st.total} objetivo${st.total === 1 ? '' : 's'}`;
  $('msg').textContent = !st.total ? '¡Añade tu primer objetivo!' :
    pct === 100 ? '¡Día perfecto! 🏆' : pct >= 50 ? '¡Ya casi lo tienes! 💪' : pct > 0 ? '¡Buen comienzo! 🚀' : '¡A por el día! ✨';

  // lista
  const list = $('list'); list.innerHTML = '';
  const gs = goalsFor(selected);
  if (!gs.length) {
    list.innerHTML = `<div class="empty"><div class="big">🌈</div><p>Nada por aquí todavía.<br>Toca <b>＋ Añadir objetivo</b> abajo.</p></div>`;
    return;
  }
  for (const t of ['morning', 'afternoon', 'night', 'any']) {
    const group = gs.filter(g => (g.time || 'any') === t);
    if (!group.length) continue;
    const sec = document.createElement('div'); sec.className = 'section';
    sec.innerHTML = `<h3>${TIME_TITLES[t]}</h3>`;
    group.sort((a, b) => isDone(a, selected) - isDone(b, selected));
    for (const g of group) sec.appendChild(goalCard(g));
    list.appendChild(sec);
  }
}

function repeatText(g) {
  if (g.repeat === 'once') return 'Solo este día';
  if (g.days.length === 7) return 'Todos los días';
  if (g.days.join() === '1,2,3,4,5') return 'Lunes a viernes';
  if (g.days.join() === '0,6') return 'Fin de semana';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => g.days.includes(d)).map(d => DAY_SHORT[d]).join(' · ');
}

function goalCard(g) {
  const c = countFor(g, selected), target = g.target || 1, done = c >= target;
  const card = document.createElement('div');
  card.className = 'goal' + (done ? ' done' : '');
  card.style.setProperty('--c', g.color);
  card.setAttribute('role', 'button');
  card.innerHTML = `
    <div class="em">${g.emoji}</div>
    <div class="info">
      <div class="gt"></div>
      <div class="gm">${target > 1 ? `${c} / ${target} · ` : ''}${repeatText(g)}</div>
      ${target > 1 ? `<div class="bar"><i style="width:${Math.min(100, c / target * 100)}%"></i></div>` : ''}
    </div>
    <div class="check">✓</div>
    <button class="more" aria-label="Opciones">⋯</button>`;
  card.querySelector('.gt').textContent = g.title;
  card.onclick = e => {
    if (e.target.closest('.more')) { openOptions(g); return; }
    toggle(g);
  };
  return card;
}

function toggle(g) {
  const before = dayStats(selected);
  db.done[selected] = db.done[selected] || {};
  const target = g.target || 1, c = countFor(g, selected);
  db.done[selected][g.id] = c >= target ? 0 : c + 1;
  save();
  vibrate(15);
  const after = dayStats(selected);
  render();
  if (after.total && after.done === after.total && before.done !== before.total) celebrate();
}

/* ---------- Hoja inferior ---------- */
function openSheet(html) {
  $('sheetBody').innerHTML = html;
  $('sheet').scrollTop = 0;
  $('overlay').classList.add('open');
  $('sheet').classList.add('open');
}
function closeSheet() {
  $('overlay').classList.remove('open');
  $('sheet').classList.remove('open');
}
$('overlay').onclick = closeSheet;

let draft = null;

// Paso 1: elegir categoría
function stepCategory() {
  openSheet(`
    <div class="sheet-head"><h2>¿Qué tipo de objetivo?</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="grid">${CATS.map(c => `
      <button class="tile cat" style="--c:${c.color}" data-cat="${c.id}">
        <span class="te">${c.emoji}</span><span class="tl">${c.name}</span>
      </button>`).join('')}
      <button class="tile" data-custom><span class="te">✍️</span><span class="tl">Otro</span></button>
    </div>`);
  bind('[data-close]', closeSheet);
  bind('[data-cat]', el => stepGoal(CATS.find(c => c.id === el.dataset.cat)));
  bind('[data-custom]', () => stepCustom());
}

// Paso 2: elegir objetivo de la categoría
function stepGoal(cat) {
  openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-back>‹</button><h2>${cat.emoji} ${cat.name}</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="grid">${cat.goals.map((g, i) => `
      <button class="tile cat" style="--c:${cat.color}" data-i="${i}">
        <span class="te">${g[0]}</span><span class="tl">${g[1]}</span>
      </button>`).join('')}
      <button class="tile" data-custom><span class="te">✍️</span><span class="tl">Otro</span></button>
    </div>`);
  bind('[data-back]', stepCategory);
  bind('[data-close]', closeSheet);
  bind('[data-i]', el => {
    const g = cat.goals[+el.dataset.i];
    stepDetails({ emoji: g[0], title: g[1], color: cat.color, target: g[2] || 1 });
  });
  bind('[data-custom]', () => stepCustom(cat));
}

// Opcional: escribir un objetivo propio
function stepCustom(cat) {
  const color = cat ? cat.color : '#6c5ce7';
  let emoji = cat ? cat.emoji : '🎯';
  openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-back>‹</button><h2>✍️ Objetivo propio</h2><button class="icon-btn" data-close>✕</button></div>
    <input class="text-input" id="customTitle" maxlength="40" placeholder="Ej: Aprender a cocinar paella">
    <div class="label">Elige un icono</div>
    <div class="chips">${EMOJI_PICK.map(e => `<button class="chip ${e === emoji ? 'on' : ''}" data-e="${e}" style="font-size:22px;padding:8px 12px">${e}</button>`).join('')}</div>
    <button class="primary" data-next>Siguiente ›</button>`);
  bind('[data-back]', () => cat ? stepGoal(cat) : stepCategory());
  bind('[data-close]', closeSheet);
  bind('[data-e]', el => {
    emoji = el.dataset.e;
    document.querySelectorAll('[data-e]').forEach(b => b.classList.toggle('on', b === el));
  });
  bind('[data-next]', () => {
    const title = $('customTitle').value.trim();
    if (!title) { $('customTitle').focus(); toast('Escribe un nombre corto ✏️'); return; }
    stepDetails({ emoji, title, color, target: 1 });
  });
}

// Paso 3: cuándo y cada cuánto (todo con botones, con valores por defecto)
function stepDetails(base) {
  draft = Object.assign({ time: guessTime(), repeat: 'once', days: [parse(selected).getDay()] }, base);
  const paint = () => {
    openSheet(`
      <div class="sheet-head"><button class="icon-btn" data-back>‹</button><h2>Casi listo</h2><button class="icon-btn" data-close>✕</button></div>
      <div class="preview" style="--c:${draft.color}"><div class="em">${draft.emoji}</div><div class="gt"></div></div>

      <div class="label">¿Cuándo?</div>
      <div class="chips">${TIMES.map(t => `<button class="chip ${draft.time === t.id ? 'on' : ''}" data-time="${t.id}">${t.label}</button>`).join('')}</div>

      <div class="label">¿Se repite?</div>
      <div class="chips">${REPEATS.map(r => `<button class="chip ${draft.repeat === r.id ? 'on' : ''}" data-rep="${r.id}">${r.label}</button>`).join('')}</div>
      ${draft.repeat === 'custom' ? `<div class="chips" style="margin-top:10px">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="chip daychip ${draft.days.includes(d) ? 'on' : ''}" data-day="${d}">${DAY_SHORT[d]}</button>`).join('')}</div>` : ''}

      <div class="label">¿Cuántas veces al día?</div>
      <div class="stepper">
        <button data-step="-1">−</button><div class="val">${draft.target}×</div><button data-step="1">＋</button>
      </div>

      <button class="primary" data-save>✓ Añadir objetivo</button>`);
    document.querySelector('.preview .gt').textContent = draft.title;
    bind('[data-back]', stepCategory);
    bind('[data-close]', closeSheet);
    bind('[data-time]', el => { draft.time = el.dataset.time; paint(); });
    bind('[data-rep]', el => {
      draft.repeat = el.dataset.rep;
      const r = REPEATS.find(x => x.id === draft.repeat);
      if (r.days) draft.days = r.days.slice();
      if (draft.repeat === 'custom' && !draft.days.length) draft.days = [parse(selected).getDay()];
      paint();
    });
    bind('[data-day]', el => {
      const d = +el.dataset.day;
      draft.days = draft.days.includes(d) ? draft.days.filter(x => x !== d) : [...draft.days, d];
      paint();
    });
    bind('[data-step]', el => { draft.target = Math.max(1, Math.min(20, draft.target + +el.dataset.step)); paint(); });
    bind('[data-save]', saveDraft);
  };
  paint();
}

function guessTime() {
  const h = new Date().getHours();
  if (selected !== TODAY) return 'any';
  return h < 13 ? 'morning' : h < 20 ? 'afternoon' : 'night';
}

function saveDraft() {
  if (draft.repeat !== 'once' && !draft.days.length) { toast('Elige al menos un día 📅'); return; }
  const g = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    emoji: draft.emoji, title: draft.title, color: draft.color, time: draft.time, target: draft.target,
    repeat: draft.repeat === 'once' ? 'once' : 'days',
    date: selected, from: selected, days: draft.days.slice().sort(), skip: [],
  };
  db.goals.push(g);
  save();
  closeSheet();
  render();
  vibrate(25);
  toast(`${g.emoji} ¡Objetivo añadido!`);
}

// Opciones de un objetivo
function openOptions(g) {
  const recurring = g.repeat !== 'once';
  openSheet(`
    <div class="sheet-head"><h2>${g.emoji} <span id="optTitle"></span></h2><button class="icon-btn" data-close>✕</button></div>
    ${(g.target || 1) > 1 ? `<button class="primary secondary" data-reset>↺ Poner contador a 0</button>` : ''}
    ${recurring ? `<button class="primary secondary" data-skip>⏭️ Saltar solo este día</button>` : ''}
    <button class="primary danger" data-del>🗑️ ${recurring ? 'Borrar para siempre' : 'Borrar objetivo'}</button>
    <button class="primary secondary" data-close>Cancelar</button>`);
  $('optTitle').textContent = g.title;
  bind('[data-close]', closeSheet);
  bind('[data-reset]', () => { if (db.done[selected]) db.done[selected][g.id] = 0; save(); closeSheet(); render(); });
  bind('[data-skip]', () => { g.skip = [...(g.skip || []), selected]; save(); closeSheet(); render(); toast('⏭️ Saltado hoy'); });
  bind('[data-del]', () => {
    db.goals = db.goals.filter(x => x.id !== g.id);
    save(); closeSheet(); render(); toast('🗑️ Borrado');
  });
}

/* ---------- Utilidades ---------- */
function bind(sel, fn) { document.querySelectorAll('#sheetBody ' + sel).forEach(el => el.onclick = () => fn(el)); }
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function celebrate() {
  const bits = ['🎉', '⭐', '🏆', '✨', '🎊', '💪', '🔥'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
    s.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
  vibrate([30, 60, 30]);
  toast('🏆 ¡Todos los objetivos cumplidos!');
}

$('fab').onclick = stepCategory;
$('prevWeek').onclick = () => { weekStart = addDays(weekStart, -7); render(); };
$('nextWeek').onclick = () => { weekStart = addDays(weekStart, 7); render(); };

render();
</script>
